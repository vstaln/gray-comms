[package]
name = "gray-comms"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Cross-agent message mesh for gray: rooms, DMs, presence over a tiny TCP daemon"

[lib]
name = "gray_comms"
path = "src/lib.rs"

[[bin]]
name = "gray-comms"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
